[project]
name = "comercio-agentico"
version = "0.1.0"
description = "Agente de compras verificable sobre proveedores heterogéneos, con defensa medida frente a inyección indirecta de instrucciones."
authors = [
    { name = "William Suaza Losada", email = "wills777@hotmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "crawl4ai>=0.9.5",
    "extruct>=0.18.0",
    "fastapi>=0.162.4",
    "fastmcp>=4.1.6",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.12.5",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4"]

# Signos tipográficos del español en textos y docstrings (× en «60 × 3», – en intervalos).
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
# Plantillas HTML del corpus A reconstruido: el HTML no se parte en líneas.
"src/comercio_agentico/corpus_a/construir.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["comercio_agentico"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# PyTorch solo CPU (la máquina de desarrollo no tiene GPU; evita ~3 GB de CUDA).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
