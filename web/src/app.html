<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>CotIA · agente de compras verificable</title>
		<script>
			/* Tema claro por defecto (D139): mode-watcher nace en «system» si no hay preferencia guardada. */
			try {
				if (!localStorage.getItem('cotia.tema')) localStorage.setItem('cotia.tema', 'light');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
