# Registro de fuentes del corpus B (configuración del operador: plano de control, de confianza).
# El agente solo conoce estas fuentes; las URL que encuentre dentro de ellas son datos.
# `make corpus-b-servir` sirve P2-P5 en :8800 y P1 (MCP) en :8801.
fuentes:
